set -g prefix C-Space
unbind C-b

#set -g default-shell /usr/local/bin/zsh
set -g default-shell /bin/zsh

set -g escape-time 10
set -g history-limit 50000

################## PASSTHROUGH / KEYS ##################

# Claude Code の通知・プログレスバーを外側の端末まで届かせる
set -g allow-passthrough on
# Shift+Enter などを素の Enter と区別できるようにする
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

################## MOUSE ##################

# マウス操作を有効にする
set -g mouse on
# ホイールの行き先を分岐させる
#   copy-mode 中 / マウスを要求しているアプリ / 代替スクリーンのアプリ
#     -> アプリ (または copy-mode) にそのまま転送
#   素のシェル -> tmux の copy-mode に入ってスクロールバックを遡る
# ※ 無条件に copy-mode へ入れると Claude Code や vim の内部スクロールが効かない
bind -n WheelUpPane if -Ft= '#{?pane_in_mode,1,#{?mouse_any_flag,1,#{alternate_on}}}' \
  'send -Mt=' 'select-pane -t= ; copy-mode -et='
bind -n WheelDownPane if -Ft= '#{?pane_in_mode,1,#{?mouse_any_flag,1,#{alternate_on}}}' \
  'send -Mt=' 'send -Mt='


################## WINDOW NAME ##################
set -g automatic-rename on
# NOTE: 表示形式は STATUS BAR セクションの window-status-format 側で定義する
#       (ここと二重に定義すると後勝ちになり、片方が黙って無効化される)

################## BINDINGS ##################

# wezterm の leader キーバインドに合わせる (c: session, t: window, r: rename)
# 新規セッションを作成して切り替える
bind c new-session
# 新規ウィンドウ。カレントディレクトリを引き継ぐ (デフォルトの clock-mode を上書き)
bind t new-window -c "#{pane_current_path}"
# セッション名を変更する。現在の名前を入力欄に入れた状態で開く
# (wezterm の LEADER+r = workspace のリネームに対応。既定の refresh-client を上書き)
bind r command-prompt -I "#S" { rename-session "%%" }

bind % split-window -hc "#{pane_current_path}"
bind '"' split-window -vc "#{pane_current_path}"


# Use vim keybindings in copy mode
setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Y send -X copy-line copy-pipe "reattach-to-user-namespace pbcopy"

bind p previous-window

## セッション間移動 (wezterm の SwitchWorkspaceRelative に合わせる)
bind -r N switch-client -n
bind -r P switch-client -p


## ペイン間移動のキーバインドをvi風
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

## ペインサイズ調整のキーバインドをvi風に
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

################## Define Colors ##################
# screen-256color だと truecolor が使えず、ステータスラインの色が 256 色に丸められる
set -g default-terminal "tmux-256color"
# 外側の端末 (wezterm) が truecolor に対応していることを tmux に伝える
set -as terminal-features ',xterm-256color:RGB'

# wezterm/colors.lua のパレットに合わせる
BG_DARK="#1f2022"        # wezterm の背景色。反転表示したセグメントの文字色に使う
FG_NORMAL="#9a9eab"
FG_BRIGHT="#E8EAED"
FG_DIM="#5F6368"
# wezterm の #4285F4 は鮮やかすぎるので彩度を半分に落とした (HSL 217°/89%→50%/61%)
ACCENT_BLUE="#6A90CD"
ACCENT_TEAL="#5FA3A3"     # 選択中 (アクティブウィンドウ・各種モード・メニュー)
ACCENT_GREEN="#34A853"    # 追加・良好。ここでは使わず tmux-status の git 表示で使う
ACCENT_YELLOW="#FBBC04"
ACCENT_RED="#EA4335"
ACCENT_CYAN="#24C1E0"

PANE_BORDER="#fcfcfc"
PANE_ACTIVE_BORDER="#248a81"


############ PANE ############

set -g pane-border-style fg=$PANE_BORDER
set -g pane-active-border-style fg=$PANE_ACTIVE_BORDER
setw -g pane-border-status off


############ STATUS BAR ############
#
#   [セッション]  ウィンドウ一覧        カレントパス  git  SYNC / ZOOM / COPY
#
# 背景は透過 (bg=default) させて wezterm の背景に溶かし、色だけで情報を区切る。

# 1行表示。実行中のサーバが 2 行設定を掴んだままにならないよう明示的に戻す
# (設定ファイルから行を消しても、既にサーバに入った値は消えない)
set -g status on
set -gu status-format

# git ブランチの切り替えに追従できる程度の間隔にする
set -g status-interval 5
set -g status-style "bg=default,fg=$FG_NORMAL"
# ウィンドウ一覧の位置を右側の内容量で動かさないよう左寄せにする
set -g status-justify left

### 左: セッション名。prefix (C-Space) の入力待ちのあいだ反転する
# 反転色は通常時と同じ青。黄は ZOOM や git の未ステージ変更で使っているので意味を分ける
set -g status-left-length 40
set -g status-left "#[range=user|session]#{?client_prefix,#[bg=$ACCENT_BLUE]#[fg=$BG_DARK]#[bold],#[fg=$ACCENT_BLUE]#[bold]} #S #[default]#[norange] "

### 右: カレントパスと git、それに見落とすと事故になる状態 (同期入力・ズーム・コピーモード)
# 長いパスは先頭を … に畳んで右端を潰さない
set -g status-right-length 150
set -g status-right "#[range=user|cwd]#[fg=$FG_NORMAL]#{=/-45/…:#{s|^$HOME|~|:pane_current_path}}#[norange] #[range=user|git]#(tmux-status git #{pane_current_path})#[norange]#{?pane_synchronized,#[fg=$ACCENT_RED]#[bold]  SYNC#[default],}#{?window_zoomed_flag,#[fg=$ACCENT_YELLOW]#[bold]  ZOOM#[default],}#{?pane_in_mode,#[fg=$ACCENT_RED]#[bold]  #{?#{==:#{pane_mode},copy-mode},COPY,#{pane_mode}} #{scroll_position}/#{history_size}#[default],} "

### 中央: ウィンドウ一覧。色は style 側で指定して bell/activity の強調を殺さない
setw -g window-status-separator ""
setw -g window-status-style "fg=$FG_DIM"
setw -g window-status-current-style "bg=$ACCENT_TEAL,fg=$BG_DARK,bold"
setw -g window-status-bell-style "fg=$ACCENT_RED,bold"
setw -g window-status-activity-style "fg=$ACCENT_YELLOW,bold"
# ウィンドウ名が zsh のまま (= 何も実行していない) ならカレントディレクトリ名で代用する
setw -g window-status-format         " #I:#{?#{m:#W,zsh},#{b:pane_current_path},#W}#F "
# アクティブなウィンドウは反転色で分かるので #F (末尾の '*') は出さない
setw -g window-status-current-format " #I:#{?#{m:#W,zsh},#{b:pane_current_path},#W} "

### フッターのセグメントはクリックで操作できる
bind -n MouseDown1Status {
  # git -> lazygit をポップアップで開く (wezterm の LEADER+g と揃える)
  if -F "#{==:#{mouse_status_range},user|git}" {
    display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
  }
  # カレントパス -> パスをクリップボードへコピーする
  if -F "#{==:#{mouse_status_range},user|cwd}" {
    run-shell -b "printf %s #{q:pane_current_path} | pbcopy"
    display-message "コピーしました: #{pane_current_path}"
  }
  # セッション名 -> セッションとウィンドウの一覧を開く
  if -F "#{==:#{mouse_status_range},user|session}" {
    choose-tree -Zs
  }
  # ウィンドウ名 -> そのウィンドウへ移動する (tmux の既定動作)
  if -F "#{m:window|*,#{mouse_status_range}}" {
    select-window -t=
  }
}


############ MESSAGE / MENU / MODE ############
#
# tmux 既定はどれも bg=yellow で、ステータスラインのパレットから浮くうえに
# 「入力待ち」と「選択中」が同じ色になってしまう。意味ごとに分ける。
#   入力待ち (プロンプト・通知)     -> 青  ... status-left の prefix 反転と揃える
#   選択中   (メニュー・各種モード) -> 緑  ... アクティブウィンドウと揃える

# prefix+r の入力欄、パスをコピーしたときの通知、エラー表示
set -g message-style "bg=$ACCENT_BLUE,fg=$BG_DARK,bold"
# 上記プロンプトで vi のコマンドモードに入ったとき。反転させて入力中と区別する
set -g message-command-style "bg=$BG_DARK,fg=$ACCENT_BLUE,bold"
# 右クリックメニューや prefix+< のカーソル行
set -g menu-selected-style "bg=$ACCENT_TEAL,fg=$BG_DARK,bold"
# copy-mode の選択範囲
set -g mode-style "bg=$ACCENT_TEAL,fg=$BG_DARK,bold"


############ セッション / ウィンドウの選択 (prefix + w) ############
#
# 一覧・移動・リネーム・新規作成・削除・一括編集の入口を prefix + w 1 つに統合してある。
# choose-tree は fzf 版と役割がほぼ重なるうえ、キーがハードコードで足せないので使わない
# (プレビューは fzf の --preview で代替できる)。
#
# 全セッションのウィンドウが平坦に並ぶ (wezterm の LEADER+w と同じ操作感)。
# ^e で tmux-oil のバッファ一括編集へ抜ける。キーの一覧は fzf のヘッダに出している
bind w display-popup -E -w 90% -h 70% tmux-switch
