git:
  branchLogCmd: git log --graph --color=always --date=format:'%Y-%m-%d %H:%M' --pretty=format:'%C(#a0a0a0 reverse)%h%Creset %C(cyan)<%ad>%Creset %C(#dd4814)%an%Creset %C(yellow reverse)%d%Creset %C(white bold)%s%Creset' {{branchName}} --
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
  allBranchesLogCmds:
    - git log --graph --color=always --date=format:'%Y-%m-%d %H:%M' --pretty=format:'%C(#a0a0a0 reverse)%h%Creset %C(cyan)<%ad>%Creset %C(#dd4814)%an%Creset %C(yellow reverse)%d%Creset %C(white bold)%s%Creset' --
customCommands:
  - command: czg
    context: files
    key: c
    output: terminal
gui:
  language: 'en'
  sidePanelWidth: 0.15
  nerdFontsVersion: "3"
  theme:
    selectedLineBgColor:
      - underline
refresher:
  refreshInterval: 3
os:
  editPreset: "nvim-remote"
  editCommand: "nvim"
